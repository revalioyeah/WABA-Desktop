name: Build WABA Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\WarungAutoBagAssistant.PC.sln

      - name: Build Release
        run: dotnet build .\WarungAutoBagAssistant.PC.sln -c Release --no-restore

      - name: Upload application output
        uses: actions/upload-artifact@v4
        with:
          name: WABA-Desktop-Phase1
          path: src/WABA.Desktop/bin/Release/net10.0-windows/
          if-no-files-found: error
