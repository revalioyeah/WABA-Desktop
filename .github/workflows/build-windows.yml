name: Build WABA Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows x64
        run: dotnet restore .\WarungAutoBagAssistant.PC.sln -r win-x64

      - name: Publish Windows x64
        run: dotnet publish .\src\WABA.Desktop\WABA.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\publish

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path '.\artifacts\publish\WABA.Desktop.exe')) {
            Write-Error 'WABA.Desktop.exe tidak ditemukan pada artifacts/publish.'
            exit 1
          }
          Get-ChildItem '.\artifacts\publish' | Select-Object Name, Length

      - name: Upload application output
        uses: actions/upload-artifact@v4
        with:
          name: WABA-Desktop-Phase2-win-x64
          path: artifacts/publish/**
          if-no-files-found: error
          compression-level: 6
